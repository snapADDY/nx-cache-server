bucket:
  name: nx-cache-server
  storagePrefix: nx

access:
  existingSecret: nx-cache-tokens
  secretKeyReadOnlyToken: read-only-token

autoscaling:
  enabled: true
httpRoute:
  enabled: true
  hostnames:
    - chart-example.local
  parentRefs:
    - name: gateway
podDisruptionBudget:
  enabled: true
  minAvailable: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limit:
    memory: 256Mi
