name: Push Checks

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Check generated code is up to date
        run: |
          make generate
          git diff --exit-code internal/api
